<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#161c24" />
  <title>Giriş — Sigara Takip Sistemi</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sigara Takip" />
  <link rel="stylesheet" href="/css/style.css?v=1.9.1" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="on">
      <img class="login-logo" src="/icons/favicon.svg" alt="" width="64" height="64" />
      <h1>Sigara Takip Sistemi</h1>
      <p class="sub">Devam etmek için sigaracı hesabınızla giriş yapın</p>

      <div class="alert error" id="loginError"></div>

      <div class="field">
        <label for="username">Kullanıcı Adı <span class="req">*</span></label>
        <input type="text" id="username" name="username" autocomplete="username"
               placeholder="ör. sigaraci1" required autofocus />
      </div>

      <div class="field">
        <label for="password">Şifre <span class="req">*</span></label>
        <input type="password" id="password" name="password" autocomplete="current-password"
               placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">Giriş Yap</button>

      <p class="login-hint">
        Hesabınız yoksa yöneticiden talep edin.<br />
        Yaptığınız her kayıt adınıza işlenir.
      </p>
    </form>
  </div>

  <script src="/js/api.js?v=1.9.1"></script>
  <script src="/js/login.js?v=1.9.1"></script>
</body>
</html>
