<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#161c24" />
  <title>Arşiv — Sigara Takip Sistemi</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sigara Takip" />
  <link rel="stylesheet" href="/css/style.css?v=1.3.2" />
</head>
<body>

  <main class="container">

    <div class="page-head">
      <h1>🗂️ Arşiv</h1>
      <p>Tüm kayıtlar tarih sırasıyla. Filtreler anlık uygulanır.
         <span class="muted" id="dayNote"></span></p>
    </div>

    <section class="card card-overflow">
      <h2>Filtreler</h2>
      <div class="card-body">
        <div class="filters">
          <div class="field">
            <label for="fPlayer">Oyuncu ID</label>
            <input type="text" id="fPlayer" placeholder="Ara..." inputmode="text" />
          </div>
          <div class="field">
            <label for="fWaiterSearch">Garson</label>
            <div class="ac">
              <input type="text" id="fWaiterSearch" placeholder="Tümü — ad yazın" />
              <input type="hidden" id="fWaiter" />
              <ul class="ac-list" id="fWaiterList"></ul>
            </div>
          </div>
          <div class="field">
            <label for="fType">Sigara Türü</label>
            <select id="fType"><option value="">Tümü</option></select>
          </div>
          <div class="field">
            <label for="fUser">Sigaracı</label>
            <select id="fUser"><option value="">Tümü</option></select>
          </div>
          <div class="field field-wide">
            <label for="fFrom">Başlangıç</label>
            <div class="row-tight">
              <input type="date" id="fFrom" />
              <input type="time" id="fFromTime" aria-label="Başlangıç saati" />
            </div>
          </div>
          <div class="field field-wide">
            <label for="fTo">Bitiş</label>
            <div class="row-tight">
              <input type="date" id="fTo" />
              <input type="time" id="fToTime" aria-label="Bitiş saati" />
            </div>
          </div>
          <!-- Tarihten BAĞIMSIZ saat süzgeci: "hangi gün olursa olsun
               22:00–04:00 arası". Yukarıdaki tarih+saat aralığı tek bir
               sürekli aralık kurar; bu ise her güne ayrı ayrı uygulanır. -->
          <div class="field field-wide">
            <label for="fHourFrom">Saat aralığı <span class="muted">(her gün)</span></label>
            <div class="row-tight">
              <select id="fHourFrom" aria-label="Başlangıç saati (her gün)"></select>
              <span class="muted" aria-hidden="true">–</span>
              <select id="fHourTo" aria-label="Bitiş saati (her gün)"></select>
            </div>
          </div>

          <div class="filter-actions">
            <button class="btn-ghost btn-sm" id="clearFilters">Filtreleri Temizle</button>
            <!-- Ekrandaki filtrelerin aynısıyla tüm eşleşen kayıtları indirir.
                 Yalnızca okur; hiçbir kaydı silmez veya değiştirmez. -->
            <button class="btn-ghost btn-sm" id="csvBtn">Excel'e Aktar</button>
          </div>
        </div>

        <p class="muted mt" id="filterHint"></p>
      </div>
    </section>

    <section class="card">
      <h2>Kayıtlar <span class="badge-count" id="archiveCount"></span></h2>

      <div class="table-scroll">
        <table class="responsive">
          <thead>
            <tr>
              <th>Tarih / Saat</th><th>Oyuncu ID</th><th>Sigara Türü</th>
              <th>Adet</th><th>Garson</th><th>Sigaracı</th><th>Info</th>
            </tr>
          </thead>
          <tbody id="archiveBody">
            <tr><td colspan="8" class="empty">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pager">
        <span class="info" id="pagerInfo">—</span>
        <button class="btn-ghost btn-sm" id="prevPage" disabled>‹ Önceki</button>
        <button class="btn-ghost btn-sm" id="nextPage" disabled>Sonraki ›</button>
      </div>
    </section>

  </main>

  <div id="toasts"></div>

  <script src="/js/api.js?v=1.3.2"></script>
  <script src="/js/layout.js?v=1.3.2"></script>
  <script src="/js/autocomplete.js?v=1.3.2"></script>
  <script src="/js/danger.js?v=1.3.2"></script>
  <script src="/js/degisim.js?v=1.3.2"></script>
  <script src="/js/arsiv.js?v=1.3.2"></script>
</body>
</html>
