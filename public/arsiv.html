<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#161c24" />
  <title>Arşiv — Sigara Takip Sistemi</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <main class="container">

    <div class="page-head">
      <h1>🗂️ Arşiv</h1>
      <p>Tüm kayıtlar tarih sırasıyla. Filtreler anlık uygulanır.</p>
    </div>

    <section class="card card-overflow">
      <h2>Filtreler</h2>
      <div class="card-body">
        <div class="filters">
          <div class="field">
            <label for="fPlayer">Oyuncu ID</label>
            <input type="text" id="fPlayer" placeholder="Ara..." inputmode="text" />
          </div>
          <div class="field">
            <label for="fWaiterSearch">Garson</label>
            <div class="ac">
              <input type="text" id="fWaiterSearch" placeholder="Tümü — ad yazın" />
              <input type="hidden" id="fWaiter" />
              <ul class="ac-list" id="fWaiterList"></ul>
            </div>
          </div>
          <div class="field">
            <label for="fType">Sigara Türü</label>
            <select id="fType"><option value="">Tümü</option></select>
          </div>
          <div class="field">
            <label for="fUser">Sigaracı</label>
            <select id="fUser"><option value="">Tümü</option></select>
          </div>
          <div class="field">
            <label for="fFrom">Başlangıç</label>
            <input type="date" id="fFrom" />
          </div>
          <div class="field">
            <label for="fTo">Bitiş</label>
            <input type="date" id="fTo" />
          </div>
          <div class="filter-actions">
            <button class="btn-ghost btn-sm" id="clearFilters">Filtreleri Temizle</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>Kayıtlar <span class="badge-count" id="archiveCount"></span></h2>

      <div class="table-scroll">
        <table class="responsive">
          <thead>
            <tr>
              <th>Tarih / Saat</th><th>Oyuncu ID</th><th>Sigara Türü</th>
              <th>Adet</th><th>Garson</th><th>Sigaracı</th><th>Info</th>
            </tr>
          </thead>
          <tbody id="archiveBody">
            <tr><td colspan="7" class="empty">Yükleniyor...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pager">
        <span class="info" id="pagerInfo">—</span>
        <button class="btn-ghost btn-sm" id="prevPage" disabled>‹ Önceki</button>
        <button class="btn-ghost btn-sm" id="nextPage" disabled>Sonraki ›</button>
      </div>
    </section>

  </main>

  <div id="toasts"></div>

  <script src="/js/api.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/autocomplete.js"></script>
  <script src="/js/danger.js"></script>
  <script src="/js/arsiv.js"></script>
</body>
</html>
