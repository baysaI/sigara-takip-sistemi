<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#161c24" />
  <title>ID Sorgula — Sigara Takip Sistemi</title>
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Sigara Takip" />
  <link rel="stylesheet" href="/css/style.css?v=1.5.0" />
</head>
<body>

  <main class="container">

    <div class="page-head">
      <h1>🔍 ID Sorgula</h1>
      <p>Bir oyuncunun son alma saatini ve 4 saat kuralı durumunu görün.</p>
    </div>

    <div class="split">

      <section class="card">
        <h2>Sorgu</h2>
        <div class="card-body">
          <div class="field">
            <label for="lookupId">Oyuncu ID</label>
            <input type="text" id="lookupId" maxlength="40" enterkeyhint="search"
                   placeholder="ör. 1247" />
          </div>
          <button class="btn-primary" id="lookupBtn">Sorgula</button>
          <p class="muted mt center" id="lookupHint">Sorgulamak için bir ID girin.</p>
        </div>
      </section>

      <section class="card" id="resultCard">
        <h2>Sonuç</h2>
        <div class="card-body" id="lookupResult">
          <p class="muted center">Henüz sorgu yapılmadı.</p>
        </div>
      </section>

    </div>
  </main>

  <div id="toasts"></div>

  <script src="/js/api.js?v=1.5.0"></script>
  <script src="/js/layout.js?v=1.5.0"></script>
  <script src="/js/sorgu.js?v=1.5.0"></script>
</body>
</html>
